<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schermstudio</title>
    <link rel="stylesheet" href="styles.css?v=20260630-announcement-hex" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <strong>Schermstudio</strong>
            <span>Roermond</span>
          </div>
        </div>

        <nav class="nav-tabs" aria-label="Hoofdnavigatie">
          <button class="nav-tab active" data-view="editor" title="Ontwerper">
            <span class="icon">✦</span>
            <span>Ontwerper</span>
          </button>
          <button class="nav-tab" data-view="admin" title="Beheer">
            <span class="icon">☰</span>
            <span>Beheer</span>
          </button>
          <button class="nav-tab screen-tab" id="menuOpenSignage" title="Scherm in nieuw tabblad openen">
            <span class="icon">↗</span>
            <span>Scherm</span>
          </button>
        </nav>

        <div class="preset-panel">
          <div class="active-deploy" id="deployedPresetLabel">Actief scherm: geen preset</div>
          <label for="presetSelect">Preset kiezen</label>
          <select id="presetSelect"></select>
          <label for="presetName">Presetnaam</label>
          <input id="presetName" type="text" value="Ochtendspits Roermond" />
          <button id="savePreset" class="primary-btn">Preset opslaan</button>
          <button id="deployPreset" class="primary-btn deploy-btn">Preset deployen</button>
          <button id="newPreset" class="ghost-btn">Nieuwe preset</button>
          <button id="deletePreset" class="ghost-btn">Preset verwijderen</button>
          <button id="resetPreset" class="ghost-btn">Voorbeeld herstellen</button>
        </div>
      </aside>

      <main>
        <section class="view active" id="editorView">
          <div class="topbar">
            <div>
              <h1>Ontwerper</h1>
              <p>Ontwerp widgets voor een scherm van 5760 x 1080 px.</p>
            </div>
            <div class="scale-control">
              <label for="previewScale">Voorvertoning</label>
              <input id="previewScale" type="range" min="8" max="80" value="45" />
              <span id="scaleLabel">45%</span>
            </div>
          </div>

          <div class="editor-layout">
            <section class="tool-panel" aria-label="Widget instellingen">
              <div class="panel-section">
                <h2>Widgets</h2>
                <button class="widget-button" data-add-widget="logo">Logo</button>
                <button class="widget-button" data-add-widget="announcements">Mededelingen</button>
                <button class="widget-button" data-add-widget="hex">Hexagon</button>
              </div>

              <div class="panel-section">
                <h2>Raster</h2>
                <div class="settings-row">
                  <label>Hexagongrootte</label>
                  <div id="gridHexSize" class="segmented-control" role="group" aria-label="Hexagongrootte">
                    <button type="button" data-hex-size="small">Klein</button>
                    <button type="button" data-hex-size="medium">Middel</button>
                    <button type="button" data-hex-size="large">Groot</button>
                  </div>
                </div>
                <div class="settings-row">
                  <label for="gridBorderWidth">Randdikte</label>
                  <input id="gridBorderWidth" type="range" min="0" max="18" value="8" />
                </div>
                <div class="settings-row">
                  <label for="gridBorderColor">Randkleur</label>
                  <input id="gridBorderColor" type="color" value="#003b70" />
                </div>
                <div class="settings-grid">
                  <div class="settings-row">
                    <label for="gridOffsetX">Raster X</label>
                    <input id="gridOffsetX" type="number" min="-1200" max="1200" step="10" value="0" />
                  </div>
                  <div class="settings-row">
                    <label for="gridOffsetY">Raster Y</label>
                    <input id="gridOffsetY" type="number" min="-600" max="600" step="10" value="0" />
                  </div>
                </div>
              </div>

              <div class="panel-section">
                <h2>Achtergrond</h2>
                <input id="backgroundUploadInput" class="visually-hidden" type="file" accept="image/*,.svg,.webp,.avif" />
                <button id="backgroundUploadButton" class="widget-button" type="button">Afbeelding toevoegen</button>
                <div id="backgroundAssetGrid" class="asset-grid"></div>
                <button id="removeBackground" class="ghost-btn light-ghost" type="button">Achtergrond wissen</button>
              </div>

              <div class="panel-section">
                <h2>Selectie</h2>
                <div id="selectionEmpty" class="muted">Selecteer een widget of hexagon.</div>
                <form id="settingsForm" class="settings-form hidden"></form>
              </div>
            </section>

            <section class="stage-wrap" aria-label="Schermcanvas">
              <div class="stage-toolbar">
                <button id="fitStage" class="icon-btn" title="Passend tonen">⤢</button>
              </div>
              <div class="stage-viewport">
                <div id="stageScaler" class="stage-scaler">
                  <div id="editorStage" class="signage-stage editor-stage"></div>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="signageView">
          <div id="signageStage" class="signage-stage live-stage"></div>
        </section>

        <section class="view" id="adminView">
          <div class="topbar">
            <div>
              <h1>Beheer</h1>
              <p>Beheer mededelingen voor de signage-widget.</p>
            </div>
          </div>

          <div class="admin-layout">
            <form id="announcementForm" class="admin-form">
              <label for="announcementTitle">Titel</label>
              <input id="announcementTitle" type="text" placeholder="Bijvoorbeeld: Perronwijziging" required />

              <label for="announcementText">Tekst</label>
              <textarea id="announcementText" rows="5" placeholder="Schrijf de mededeling..." required></textarea>

              <label for="announcementPriority">Prioriteit</label>
              <select id="announcementPriority">
                <option value="normaal">Normaal</option>
                <option value="belangrijk">Belangrijk</option>
                <option value="urgent">Urgent</option>
              </select>

              <label for="announcementDuration">Zichtbaar voor</label>
              <div class="duration-inputs">
                <input id="announcementDuration" type="number" min="1" value="8" required />
                <select id="announcementDurationUnit">
                  <option value="hours">Uren</option>
                  <option value="days">Dagen</option>
                </select>
              </div>

              <button class="primary-btn" type="submit">Mededeling publiceren</button>
            </form>

            <section>
              <h2>Actieve mededelingen</h2>
              <div id="announcementList" class="announcement-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js?v=20260630-announcement-hex"></script>
  </body>
</html>
